<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>decrypt</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
      background: #f0b2c1;
      color: #312b51;
      font-family: sans-serif;
    }
    main { width: 100%; max-width: 48rem; }
    h1 {
      margin: 0 0 2rem;
      font-size: 1.5rem;
      font-weight: normal;
      line-height: 1.12;
      text-wrap: balance;
    }
    p, label, button, input, output, .note {
      font-family: ui-monospace, monospace;
      font-size: 0.75rem;
      line-height: 1.8;
    }
    p { margin: 0 0 1rem; }
    figure { margin: 0 0 2rem; }
    .panel {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #eaa4b5;
    }
    .panel img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      transition: transform 0.5s ease;
      transform: rotate(var(--turn, 0deg));
    }
    .reference img { transform: none; transition: none; }
    figcaption { margin-top: 0.5rem; display: flex; gap: 1rem; align-items: baseline; }
    button {
      appearance: none;
      border: 1px solid #312b51;
      background: transparent;
      color: #312b51;
      padding: 0.2rem 0.6rem;
      cursor: pointer;
    }
    button:hover { background: #312b51; color: #f0b2c1; }
    form { display: grid; gap: 0.75rem; margin-bottom: 1rem; }
    label { display: grid; gap: 0.2rem; }
    input {
      width: 100%;
      border: 0;
      border-bottom: 1px solid #312b51;
      background: transparent;
      color: #312b51;
      padding: 0.3rem 0;
      letter-spacing: 0.05em;
    }
    input:focus { outline: none; border-bottom-width: 2px; }
    output { display: block; white-space: pre-wrap; min-height: 2.5rem; }
    .error { color: #7a1f3d; }
    .working { opacity: 0.6; }
  </style>
</head>
<body>
  <main>
    <h1>decrypt.</h1>

    <figure>
      <div class="panel message"><img id="message" src="illustration.png" alt=""></div>
      <figcaption>
        <button type="button" id="turn" aria-label="turn a quarter">↻ turn</button>
        <span class="note" id="turn-label">upright</span>
      </figcaption>
    </figure>

    <figure class="reference">
      <div class="panel"><img src="reference.png" alt=""></div>
    </figure>

    <form id="decoder" autocomplete="off">
      <label>key
        <input id="key" name="key" type="text" spellcheck="false" autocapitalize="characters" inputmode="text">
      </label>
      <label>passphrase
        <input id="passphrase" name="passphrase" type="text" spellcheck="false" autocapitalize="characters">
      </label>
      <div><button type="submit" id="go">decrypt</button></div>
    </form>
    <output id="result" for="key passphrase" aria-live="polite"></output>

    <p class="note" style="margin-top:2rem">1-667-CALL-PAT</p>
  </main>
  <script type="module" src="decoder.js"></script>
</body>
</html>
